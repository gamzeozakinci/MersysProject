name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Dry run and safe UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dry run, check that every step has code
        run: mvn -B -ntp test -Dcucumber.execution.dry-run=true "-Dcucumber.filter.tags=not @Bug"

      - name: Run the CI suite in headless Chrome
        run: mvn -B -ntp test -Dbrowser=chrome -DsuiteXmlFile=src/XML_files/ci.xml "-Dcucumber.filter.tags=not @NoCI and not @Bug"

      - name: Save reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/SparkReport
            target/screenshots
          if-no-files-found: ignore
